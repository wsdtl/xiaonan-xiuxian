<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>晓楠修仙 · 百科</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">晓楠</span>
      <h1 class="brand-title">百科</h1>
    </div>
    <div class="search-wrap">
      <input id="query" class="search" type="search" placeholder="输入编号或完整名称，回车检索">
    </div>
  </header>
  <main class="app">
    <nav class="sidebar">
      <p class="sidebar-title">编号前缀</p>
      <ul id="prefixes" class="prefixes"></ul>
    </nav>
    <section class="content">
      <div id="crumb" class="crumb"></div>
      <p id="status" class="status">正在载入…</p>
      <ol id="entries" class="entries"></ol>
      <nav id="pager" class="pager"></nav>
      <article id="detail" class="detail"></article>
    </section>
  </main>
</body>
</html>
