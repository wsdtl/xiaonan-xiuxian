<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>晓楠修仙 · 天道后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/game-console/style.css">
</head>
<body>
  <main class="console-shell" id="consoleShell" hidden>
    <header class="console-header">
      <div class="brand-block">
        <h1>晓楠修仙</h1>
        <span>天道</span>
      </div>
      <div class="driver-filter" role="group" aria-label="消息来源">
        <button type="button" data-filter="all" class="is-active">全部</button>
        <button type="button" data-filter="qq">QQ</button>
        <button type="button" data-filter="local">本地</button>
      </div>
      <div class="header-actions">
        <span class="connection-status is-waiting" id="connectionStatus">连接中</span>
        <button type="button" class="logout-button" id="logoutButton">退出</button>
      </div>
    </header>

    <section class="message-stage" aria-label="消息流水">
      <div class="message-list" id="messageList" tabindex="0">
        <div class="history-sentinel" id="historySentinel" aria-live="polite">读取更早消息</div>
      </div>
      <button type="button" class="jump-latest" id="jumpLatest" hidden>
        回到最新 <span id="unreadCount"></span>
      </button>
    </section>

    <form class="command-composer" id="commandForm">
      <textarea id="commandInput" rows="1" maxlength="4000" placeholder="输入游戏命令" aria-label="游戏命令"></textarea>
      <button type="submit" id="sendButton">发送</button>
    </form>
  </main>

  <section class="login-shell" id="loginShell">
    <form class="login-panel" id="loginForm" autocomplete="on">
      <div class="login-mark">晓楠修仙</div>
      <h1>天道后台</h1>
      <label for="username">身份</label>
      <input id="username" name="username" type="text" value="天道" autocomplete="username" readonly required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="login-status" id="loginStatus" role="status" aria-live="polite"></p>
      <button type="submit" id="loginButton">进入管理台</button>
    </form>
  </section>

  <noscript>此页面需要启用 JavaScript。</noscript>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous" defer></script>
  <script src="/static/game-console/app.js" defer></script>
</body>
</html>
