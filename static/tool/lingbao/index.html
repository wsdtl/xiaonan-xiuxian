<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵宝谱 · 晓楠修仙</title>
<link rel="stylesheet" href="/static/tool/lingbao/style.css">
</head>
<body>
<main id="app">
<header><p class="eyebrow">晓楠修仙 / 先天灵宝</p><h1 id="title">灵宝谱</h1><p id="intro">正在读取…</p></header>
<p id="status" role="status" aria-live="polite"></p>
<section class="bar" aria-label="挑自己">
<label><span id="label-scope">挑自己</span><select id="scope"></select></label>
<button id="refresh" type="button">刷新</button>
<span id="tabs" class="tabs"></span>
<p id="notice"></p>
</section>
<section class="panel">
<section class="current">
<h2 id="label-active">当前执掌</h2>
<p id="active" class="active"></p>
</section>
<h2 id="label-owned">你的灵宝谱</h2>
<p id="vault" class="vault"></p>
<div id="owned"></div>
<nav class="row">
<button id="prev" type="button">上一页</button>
<span id="page-text" class="page-text"></span>
<button id="next" type="button">下一页</button>
</nav>
</section>
</main>
<dialog id="detail-dialog" class="sheet" aria-label="灵宝详情">
<form method="dialog" class="sheet-close">
<button type="submit" aria-label="关闭详情">✕</button>
</form>
<h2 id="detail-title" class="sheet-title"></h2>
<div id="detail"></div>
</dialog>
<script src="/static/tool/lingbao/app.js" defer></script>
</body>
</html>
